name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
  # Any base, so stacked PRs get a plan too. Apply only ever runs on main.
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    uses: Xomware/github-actions/.github/workflows/terraform.yml@v1
    with:
      app: pickem
      working-directory: infrastructure/terraform
