<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="dark" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.95 0.32" numOctaves="2" seed="11" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.09  0 0 0 0 0.03  1.5 0 0 0 -0.62" />
  </filter>
  <filter id="light" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.2 0.4" numOctaves="1" seed="4" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.78  0 0 0 0 0.92  0 0 0 0 0.62  1.6 0 0 0 -0.92" />
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="2" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.6  0 0 0 0 0.3  0.5 0 0 0 -0.2" />
  </filter>
  <rect width="240" height="240" filter="url(#wear)" />
  <rect width="240" height="240" filter="url(#dark)" />
  <rect width="240" height="240" filter="url(#light)" />
</svg>
