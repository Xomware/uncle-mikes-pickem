<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f3f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f1f3f6;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f3f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border:1px solid #dde2ea;border-radius:8px;">
        <tr>
          <td style="padding:20px 28px;background-color:#111a2b;border-radius:8px 8px 0 0;border-bottom:4px solid #e2b13c;">
            <a href="{{ site }}" style="text-decoration:none;">
              <span style="display:block;font:700 12px/1.2 Arial,Helvetica,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#e2b13c;">Uncle Mike's</span>
              <span style="display:block;font:700 24px/1.2 Arial,Helvetica,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#ffffff;">NFL Pick Em</span>
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;font:16px/1.55 Arial,Helvetica,sans-serif;color:#1a2233;">
            {% block body %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px;border-top:1px solid #dde2ea;font:13px/1.5 Arial,Helvetica,sans-serif;color:#5a6477;">
            You're getting this because you're in {{ group_name }} on {{ brand }}.<br>
            <a href="{{ unsubscribe_url }}" style="color:#5a6477;text-decoration:underline;">Unsubscribe</a>
            &nbsp;&middot;&nbsp;
            <a href="{{ site }}/profile/" style="color:#5a6477;text-decoration:underline;">Email settings</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
