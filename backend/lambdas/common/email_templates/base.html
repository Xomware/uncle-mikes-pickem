<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:{{ c.cream }};">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:{{ c.cream }};">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{ c.cream }}" style="background-color:{{ c.cream }};">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:{{ c.paper }};border:1px solid {{ c.rule }};">
        <tr>
          {# The header is one image; with images blocked, the alt text sits on the same navy band in gold. #}
          <td bgcolor="{{ c.navy }}" style="background-color:{{ c.navy }};padding:0;">
            <a href="{{ site }}" style="display:block;text-decoration:none;">
              <img src="{{ site }}/brand/email-header.png" width="600" height="132" alt="Uncle Mike's NFL Pick Em" style="display:block;width:100%;max-width:600px;height:auto;border:0;font:700 20px/1.3 Arial,Helvetica,sans-serif;letter-spacing:2px;text-align:center;text-transform:uppercase;color:{{ c.gold }};">
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 28px 32px;font:16px/1.55 Arial,Helvetica,sans-serif;color:{{ c.ink }};">
            {% block body %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 24px;border-top:3px double {{ c.rule }};font:13px/1.6 Arial,Helvetica,sans-serif;color:{{ c.muted }};">
            <p style="margin:0 0 8px;">Payments go directly to your organizer.</p>
            <p style="margin:0 0 8px;">You're getting this because you're in {{ group_name }}.</p>
            <p style="margin:0;">
              <a href="{{ unsubscribe_url }}" style="color:{{ c.muted }};text-decoration:underline;">Unsubscribe</a>
              &nbsp;&middot;&nbsp;
              <a href="{{ site }}/profile/" style="color:{{ c.muted }};text-decoration:underline;">Email settings</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
